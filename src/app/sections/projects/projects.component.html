<section id="projects" class="max-w-4xl mx-auto mb-20 scroll-mt-20">
    <h2 class="text-2xl font-bold text-fg dark:text-dark-fg mb-8 text-center">Proyectos Recientes</h2>
    
    <div class="flex flex-col gap-4 items-center">
      @for(project of projects; track project.id) {
        <app-project [project]="project"/>
      }
      
    </div>
  </section>
